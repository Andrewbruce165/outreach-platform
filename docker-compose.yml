services:
  db:
    # Phase 16 (D-05): pgvector/pgvector:pg16 = postgres:16 + the `vector` extension
    # precompiled. Same PG16 major ⇒ the existing postgres_data volume mounts
    # unchanged (no re-init, no data loss). NEVER `docker compose down -v` — it wipes
    # the prod volume. The `command:` block below MUST stay (it is per-service config;
    # the new image does NOT inherit it — Pitfall 2 / 2026-05-26 anti-drift logging).
    image: pgvector/pgvector:pg16
    container_name: outreach-platform-db
    restart: unless-stopped
    # 2026-05-26 anti-drift: log all DDL (CREATE/ALTER/DROP/TRUNCATE) and slow queries.
    # Default log_statement=none made the prod-wipe incident invisible in db logs.
    command:
      - "postgres"
      - "-c"
      - "log_statement=ddl"
      - "-c"
      - "log_min_duration_statement=1000"
    environment:
      POSTGRES_USER: outreach_user
      POSTGRES_PASSWORD: outreach_secure_pass_2026
      POSTGRES_DB: outreach_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach_user -d outreach_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outreach-platform-api
    restart: unless-stopped
    ports:
      # Биндим только на loopback: внешний трафик идёт через nginx (127.0.0.1:8444 ssl proxy_protocol)
      # за SNI stream-диспетчером MTProto-camouflage на :443. Порт 8000 занят старым telegram-api.
      - "127.0.0.1:8005:8000"
    # Phase 2 (D-18): host socket mount removed — listener auto-reconciles
    # via app/services/listener.py::_reconcile_loop. No more
    # subprocess.run(['docker','restart','telegram-listener']) in API code.
    environment:
      DATABASE_URL: postgresql+asyncpg://outreach_user:outreach_secure_pass_2026@db:5432/outreach_platform
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DECODO_HOST: ${DECODO_HOST}
      DECODO_USERNAME: ${DECODO_USERNAME}
      DECODO_PASSWORD: ${DECODO_PASSWORD}
      DECODO_PORTS: ${DECODO_PORTS}
    depends_on:
      db:
        condition: service_healthy

  listener:
    build:
      context: .
      dockerfile: Dockerfile.listener
    container_name: outreach-platform-listener
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://outreach_user:outreach_secure_pass_2026@db:5432/outreach_platform
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Listener загружает тот же app.config.Settings, поэтому Supabase env
      # обязательны (Required fields) — иначе ValidationError на старте (D-15
      # запрещает менять services, но env vars прокинуть необходимо).
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
