services:
  db:
    image: postgres:16
    container_name: outreach-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach_user
      POSTGRES_PASSWORD: outreach_secure_pass_2026
      POSTGRES_DB: outreach_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach_user -d outreach_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outreach-platform-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    environment:
      DATABASE_URL: postgresql+asyncpg://outreach_user:outreach_secure_pass_2026@db:5432/outreach_platform
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      API_KEY: ${API_KEY}
      DECODO_HOST: ${DECODO_HOST}
      DECODO_USERNAME: ${DECODO_USERNAME}
      DECODO_PASSWORD: ${DECODO_PASSWORD}
      DECODO_PORTS: ${DECODO_PORTS}
    depends_on:
      db:
        condition: service_healthy

  listener:
    build:
      context: .
      dockerfile: Dockerfile.listener
    container_name: outreach-platform-listener
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://outreach_user:outreach_secure_pass_2026@db:5432/outreach_platform
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      API_KEY: ${API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
