[tool.pytest.ini_options]
asyncio_mode = "auto"
# Share one event loop across the whole test session — fixes "cannot perform operation:
# another operation is in progress" errors that hit asyncpg when fixtures of different
# scopes (session DB setup vs function-level DB sessions/HTTP clients) end up on
# different loops in pytest-asyncio 1.x.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: integration tests touching the database",
]
